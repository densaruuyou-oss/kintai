<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>勤怠記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16273F; --navy-2:#20395C; --steel:#5A6B82;
    --paper:#F3F2EE; --card:#FFFFFF; --line:#E3E1DA;
    --amber:#C67C1F; --amber-bg:#FBF0DD; --red:#B0432E; --red-bg:#FBEAE5;
    --green:#3E7256; --green-bg:#E9F3EC; --leave-bg:#F1EEF7;
    --sans:'Noto Sans JP', sans-serif; --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior-y:none;}
  body{font-family:var(--sans);background:var(--paper);color:var(--navy);font-size:18px;-webkit-font-smoothing:antialiased;}

  .shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* Top bar */
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--navy);color:#fff;}
  .topbar select{
    font-family:var(--sans);font-size:17px;padding:8px 10px;border:none;border-radius:8px;
    background:rgba(255,255,255,0.15);color:#fff;font-weight:700;
  }
  .topbar select option{color:#000;}
  .topbar .spacer{flex:1;}
  .topbar button{
    font-family:var(--sans);font-size:15px;font-weight:700;padding:10px 14px;
    background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:8px;cursor:pointer;
  }

  /* Card area */
  .card-viewport{flex:1;display:flex;flex-direction:column;padding:18px 16px 10px;touch-action:pan-y;}
  .day-card{background:var(--card);border-radius:20px;box-shadow:0 2px 14px rgba(22,39,63,0.08);padding:22px 20px;flex:1;display:flex;flex-direction:column;transition:opacity .12s;}

  .date-head{text-align:center;margin-bottom:18px;}
  .date-head .big-date{font-size:32px;font-weight:900;letter-spacing:.02em;}
  .date-head .wd{font-size:18px;font-weight:700;color:var(--steel);margin-top:2px;}
  .date-head .wd.sun{color:var(--red);}
  .date-head .wd.sat{color:#2E5E9E;}
  .progress{text-align:center;font-size:13px;color:var(--steel);margin-top:4px;}

  /* Category grid */
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .cat-btn{
    font-family:var(--sans);font-size:17px;font-weight:700;padding:16px 6px;
    border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--navy);
    cursor:pointer;transition:.12s;
  }
  .cat-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* Time section */
  .time-section{display:flex;gap:12px;margin-bottom:16px;}
  .time-field{flex:1;background:#F7F7F5;border-radius:14px;padding:14px;text-align:center;}
  .time-field label{display:block;font-size:14px;color:var(--steel);font-weight:700;margin-bottom:8px;}
  .time-field input[type=time]{
    width:100%;font-family:var(--mono);font-size:26px;font-weight:700;text-align:center;
    border:none;background:transparent;color:var(--navy);padding:4px;
  }
  .leave-msg{
    background:var(--leave-bg);border-radius:14px;padding:22px;text-align:center;
    font-size:19px;font-weight:700;color:var(--navy-2);margin-bottom:16px;
  }

  /* Stats */
  .stat-row{display:flex;gap:8px;margin-bottom:10px;}
  .stat-box{flex:1;background:#F7F7F5;border-radius:14px;padding:10px 6px;text-align:center;}
  .stat-box.plus{background:var(--amber-bg);}
  .stat-box.minus{background:var(--red-bg);}
  .stat-box .lbl{font-size:11.5px;line-height:1.3;color:var(--steel);font-weight:700;margin-bottom:5px;}
  .stat-box .val{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--navy);}
  .stat-box.plus .val{color:var(--amber);}
  .stat-box.minus .val{color:var(--red);}

  /* Secondary fields */
  .sec-fields{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);}
  .sec-field{margin-bottom:12px;}
  .sec-field label{display:block;font-size:13.5px;color:var(--steel);font-weight:700;margin-bottom:5px;}
  .sec-field input{
    width:100%;font-family:var(--sans);font-size:17px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);
  }
  .sec-field input:focus{outline:none;border-color:var(--navy-2);}

  /* Nav footer */
  .nav-footer{display:flex;gap:10px;padding:14px 16px 22px;}
  .nav-btn{
    flex:1;font-family:var(--sans);font-size:20px;font-weight:900;padding:20px 10px;
    border:none;border-radius:16px;background:var(--navy);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .nav-btn:disabled{background:#C9CDD4;color:#fff;}
  .nav-btn.today-btn{flex:0 0 auto;background:#EDEBE4;color:var(--navy);font-size:16px;padding:20px 16px;}

  .save-toast{
    position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:10px 22px;border-radius:30px;font-size:14px;font-weight:700;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
  }
  .save-toast.show{opacity:0.92;}

  /* Summary sheet */
  .summary-overlay{
    position:fixed;inset:0;background:rgba(22,39,63,0.5);display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .summary-overlay.show{display:flex;}
  .summary-sheet{
    background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    border-radius:22px 22px 0 0;padding:20px 18px 30px;
  }
  .summary-sheet h2{font-size:20px;margin:0 0 14px;text-align:center;}
  .summary-close{
    display:block;margin:0 auto 16px;font-family:var(--sans);font-size:15px;font-weight:700;
    padding:10px 24px;border:none;border-radius:20px;background:var(--navy);color:#fff;
  }
  .sum-block{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;}
  .sum-block h3{font-size:15px;margin:0 0 10px;color:var(--navy);}
  .sum-line{display:flex;justify-content:space-between;padding:7px 0;font-size:16px;border-bottom:1px solid var(--line);}
  .sum-line:last-child{border-bottom:none;}
  .sum-line .v{font-family:var(--mono);font-weight:700;}
  .sum-line input{width:64px;font-family:var(--mono);font-size:15px;padding:5px;border:1px solid var(--line);border-radius:6px;text-align:center;}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="topbar">
    <select id="yearSelect"></select>
    <select id="monthSelect"></select>
    <div class="spacer"></div>
    <button id="summaryBtn">月末サマリー</button>
  </div>
  <div class="card-viewport" id="viewport">
    <div class="day-card" id="dayCard"></div>
  </div>
  <div class="nav-footer">
    <button class="nav-btn today-btn" id="todayBtn">今日</button>
    <button class="nav-btn" id="prevBtn">◀ 前の日</button>
    <button class="nav-btn" id="nextBtn">次の日 ▶</button>
  </div>
</div>
<div class="save-toast" id="saveToast">保存しました</div>

<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-sheet">
    <h2 id="summaryTitle">月末サマリー</h2>
    <button class="summary-close" id="summaryCloseBtn">閉じる</button>
    <div class="sum-block">
      <h3>勤務時間集計</h3>
      <div id="sumWork"></div>
    </div>
    <div class="sum-block">
      <h3>休務等（種類別内訳）</h3>
      <div id="sumLeave"></div>
    </div>
  </div>
</div>

<script>
const STORAGE_PREFIX = 'attendance';
const CATEGORIES = ['通常','半休','有休','代休','特休','欠勤'];
const NO_TIME_CATEGORIES = ['有休','代休','特休','欠勤'];
const WEEKDAYS = ['日','月','火','水','木','金','土'];

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let dayIndex = new Date().getDate() - 1;
let rows = [];
let summary = {};
let saveTimer = null;
let touchStartX = null;

// GitHub Pages版: window.storage(Claude専用)の代わりにブラウザ標準のlocalStorageを使用。
// データはこの端末・このブラウザだけに保存されます(他の人のデータとは自動的に分かれます)。
async function getPersonal(key){
  try{ return localStorage.getItem('kintai:'+key); }catch(e){ return null; }
}
async function setPersonal(key, value){
  try{ localStorage.setItem('kintai:'+key, value); }catch(e){}
}
function storageKey(y, m){ return `${STORAGE_PREFIX}:${y}-${String(m).padStart(2,'0')}`; }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function timeToMinutes(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function computeRow(row){
  const res = { actual:null, scheduled:null, overtime:null, holidayWork:null, night:null, earlyPay:null, breakHours:null };
  const inM = timeToMinutes(row.in);
  const outM = timeToMinutes(row.out);
  const dow = new Date(row.date).getDay();
  const isWeekend = (dow === 0 || dow === 6);
  const noTime = NO_TIME_CATEGORIES.includes(row.category);
  const base = row.category === '半休' ? 4 : 8;
  if(!noTime && inM !== null && outM !== null && outM > inM){
    const early = inM < 7*60 ? 0.5 : 0;
    const std = (outM - inM) > 6*60 ? 1 : 0;
    const totalBreak = early + std;
    res.breakHours = totalBreak;
    res.actual = (outM - inM)/60 - totalBreak;
    res.scheduled = Math.min(res.actual, base);
    if(isWeekend){ res.holidayWork = res.actual; } else { res.overtime = res.actual - base; }
  }
  if(inM !== null && outM !== null){
    res.night = Math.max(0, (outM - 22*60))/60;
    res.earlyPay = Math.max(0, (5*60 - inM))/60;
  }
  return res;
}
function cumulativeUpTo(idx){
  let cumOT = 0, cumEarly = 0, cumNight = 0;
  for(let i=0; i<=idx; i++){
    const c = computeRow(rows[i]);
    if(c.overtime !== null) cumOT += c.overtime;
    if(c.earlyPay !== null) cumEarly += c.earlyPay;
    if(c.night !== null) cumNight += c.night;
  }
  return {cumOT, cumEarly, cumNight};
}

function emptyRows(y,m){
  const n = daysInMonth(y,m);
  const arr = [];
  for(let d=1; d<=n; d++){
    const dateObj = new Date(y, m-1, d);
    arr.push({
      date: `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
      weekday: WEEKDAYS[dateObj.getDay()],
      category:'通常', in:'', out:'', work:'', car:'', note:''
    });
  }
  return arr;
}
function emptySummary(){ return { yukyuCarry:'0', daikyuCarry:'0' }; }

async function loadMonth(keepIndex){
  const v = await getPersonal(storageKey(currentYear,currentMonth));
  const parsed = v ? JSON.parse(v) : null;
  rows = parsed && parsed.rows ? parsed.rows : emptyRows(currentYear,currentMonth);
  summary = parsed && parsed.summary ? parsed.summary : emptySummary();
  if(rows.length !== daysInMonth(currentYear,currentMonth)) rows = emptyRows(currentYear,currentMonth);
  if(!keepIndex) dayIndex = 0;
  if(dayIndex >= rows.length) dayIndex = rows.length - 1;
  renderDay();
}
async function saveMonth(){
  try{ await setPersonal(storageKey(currentYear,currentMonth), JSON.stringify({rows, summary})); showToast(); }catch(e){}
}
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveMonth, 500); }
function showToast(){
  const t = document.getElementById('saveToast');
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 1200);
}

function setupSelectors(){
  const yearSelect = document.getElementById('yearSelect');
  const monthSelect = document.getElementById('monthSelect');
  const thisYear = new Date().getFullYear();
  yearSelect.innerHTML = '';
  for(let y = thisYear - 1; y <= thisYear + 1; y++){
    const o = document.createElement('option'); o.value = y; o.textContent = y+'年';
    if(y===currentYear) o.selected = true;
    yearSelect.appendChild(o);
  }
  monthSelect.innerHTML = '';
  for(let m = 1; m <= 12; m++){
    const o = document.createElement('option'); o.value = m; o.textContent = m+'月';
    if(m===currentMonth) o.selected = true;
    monthSelect.appendChild(o);
  }
  yearSelect.addEventListener('change', e=>{ currentYear = Number(e.target.value); loadMonth(false); });
  monthSelect.addEventListener('change', e=>{ currentMonth = Number(e.target.value); loadMonth(false); });
}

function renderDay(){
  const row = rows[dayIndex];
  const c = computeRow(row);
  const dateObj = new Date(row.date);
  const dow = dateObj.getDay();
  const wdClass = dow===0?'sun':(dow===6?'sat':'');
  const noTime = NO_TIME_CATEGORIES.includes(row.category);

  let timeHtml;
  if(noTime){
    timeHtml = `<div class="leave-msg">${row.category}の日です</div>`;
  }else{
    timeHtml = `
      <div class="time-section">
        <div class="time-field"><label>出勤時刻</label><input type="time" id="inTime" value="${row.in}"></div>
        <div class="time-field"><label>退勤時刻</label><input type="time" id="outTime" value="${row.out}"></div>
      </div>`;
  }

  const cum = cumulativeUpTo(dayIndex);
  let statsHtml = '';
  if(c.actual !== null){
    const otClass = c.overtime>0 ? 'plus' : (c.overtime<0 ? 'minus' : '');
    const cumOtClass = cum.cumOT>0 ? 'plus' : (cum.cumOT<0 ? 'minus' : '');
    statsHtml = `
      <div class="stat-row">
        <div class="stat-box"><div class="lbl">実労働時間</div><div class="val">${c.actual.toFixed(1)}h</div></div>
        <div class="stat-box"><div class="lbl">休憩時間</div><div class="val">${c.breakHours!==null?c.breakHours.toFixed(1):'-'}h</div></div>
        <div class="stat-box ${otClass}"><div class="lbl">残業（過不足）</div><div class="val">${c.overtime!==null?(c.overtime>=0?'+':'')+c.overtime.toFixed(1):'-'}</div></div>
      </div>
      <div class="stat-row">
        <div class="stat-box"><div class="lbl">早朝時間<br>(5時前)</div><div class="val">${c.earlyPay?c.earlyPay.toFixed(1):'0'}h</div></div>
        ${c.holidayWork!==null ? `<div class="stat-box"><div class="lbl">休日勤務</div><div class="val">${c.holidayWork.toFixed(1)}h</div></div>` : `<div class="stat-box"><div class="lbl">深夜時間<br>(22時以降)</div><div class="val">${c.night?c.night.toFixed(1):'0'}h</div></div>`}
      </div>
      <div class="stat-row">
        <div class="stat-box ${cumOtClass}"><div class="lbl">累計残業<br>（当月）</div><div class="val">${cum.cumOT>=0?'+':''}${cum.cumOT.toFixed(1)}h</div></div>
        <div class="stat-box"><div class="lbl">累計早朝<br>（当月）</div><div class="val">${cum.cumEarly.toFixed(1)}h</div></div>
      </div>`;
  }else{
    statsHtml = `
      <div class="stat-row">
        <div class="stat-box ${cum.cumOT>0?'plus':(cum.cumOT<0?'minus':'')}"><div class="lbl">累計残業<br>（当月）</div><div class="val">${cum.cumOT>=0?'+':''}${cum.cumOT.toFixed(1)}h</div></div>
        <div class="stat-box"><div class="lbl">累計早朝<br>（当月）</div><div class="val">${cum.cumEarly.toFixed(1)}h</div></div>
      </div>`;
  }

  document.getElementById('dayCard').innerHTML = `
    <div class="date-head">
      <div class="big-date">${currentMonth}月${dateObj.getDate()}日</div>
      <div class="wd ${wdClass}">${row.weekday}曜日</div>
      <div class="progress">${dayIndex+1} / ${rows.length}日</div>
    </div>
    <div class="cat-grid">
      ${CATEGORIES.map(c2=>`<button class="cat-btn ${c2===row.category?'active':''}" data-cat="${c2}">${c2}</button>`).join('')}
    </div>
    ${timeHtml}
    ${statsHtml}
    <div class="sec-fields">
      <div class="sec-field"><label>作業内容</label><input type="text" id="workInput" placeholder="例）〇〇工場 配送" value="${escapeHtml(row.work)}"></div>
      <div class="sec-field"><label>車番</label><input type="text" id="carInput" placeholder="例）品川100あ1234" value="${escapeHtml(row.car)}"></div>
      <div class="sec-field"><label>備考</label><input type="text" id="noteInput" placeholder="有休・残業理由など" value="${escapeHtml(row.note)}"></div>
    </div>
  `;

  document.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      row.category = btn.dataset.cat;
      renderDay();
      queueSave();
    });
  });
  const inEl = document.getElementById('inTime');
  const outEl = document.getElementById('outTime');
  if(inEl) inEl.addEventListener('change', e=>{ row.in = e.target.value; renderDay(); queueSave(); });
  if(outEl) outEl.addEventListener('change', e=>{ row.out = e.target.value; renderDay(); queueSave(); });
  document.getElementById('workInput').addEventListener('input', e=>{ row.work = e.target.value; queueSave(); });
  document.getElementById('carInput').addEventListener('input', e=>{ row.car = e.target.value; queueSave(); });
  document.getElementById('noteInput').addEventListener('input', e=>{ row.note = e.target.value; queueSave(); });

  document.getElementById('prevBtn').disabled = dayIndex === 0;
  document.getElementById('nextBtn').disabled = dayIndex === rows.length - 1;
}

function goPrev(){ if(dayIndex > 0){ dayIndex--; renderDay(); } }
function goNext(){ if(dayIndex < rows.length - 1){ dayIndex++; renderDay(); } }

document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('todayBtn').addEventListener('click', ()=>{
  const now = new Date();
  currentYear = now.getFullYear(); currentMonth = now.getMonth()+1; dayIndex = now.getDate()-1;
  document.getElementById('yearSelect').value = currentYear;
  document.getElementById('monthSelect').value = currentMonth;
  loadMonth(true);
});

const viewport = document.getElementById('viewport');
viewport.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
viewport.addEventListener('touchend', e=>{
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 60){
    if(dx < 0) goNext(); else goPrev();
  }
  touchStartX = null;
}, {passive:true});

function computeMonthTotals(){
  let cumNight=0, cumEarly=0;
  const totals = {actual:0,scheduled:0,overtime:0,holidayWork:0,night:0,earlyPay:0};
  let schedDays=0, otDays=0, holDays=0;
  rows.forEach(row=>{
    const c = computeRow(row);
    if(c.actual!==null){ totals.actual+=c.actual; }
    if(c.scheduled!==null){ totals.scheduled+=c.scheduled; schedDays++; }
    if(c.overtime!==null){ totals.overtime+=c.overtime; otDays++; }
    if(c.holidayWork!==null){ totals.holidayWork+=c.holidayWork; holDays++; }
    if(c.night!==null) totals.night+=c.night;
    if(c.earlyPay!==null) totals.earlyPay+=c.earlyPay;
  });
  const countYukyu = rows.filter(r=>r.category==='有休').length + 0.5*rows.filter(r=>r.category==='半休').length;
  const countDaikyu = rows.filter(r=>r.category==='代休').length;
  const countTokkyu = rows.filter(r=>r.category==='特休').length;
  const countKekkin = rows.filter(r=>r.category==='欠勤').length;
  return {totals, schedDays, otDays, holDays, countYukyu, countDaikyu, countTokkyu, countKekkin};
}

function openSummary(){
  const s = computeMonthTotals();
  document.getElementById('summaryTitle').textContent = `${currentYear}年${currentMonth}月 サマリー`;
  document.getElementById('sumWork').innerHTML = `
    <div class="sum-line"><span>所定労働（当月累計）</span><span class="v">${s.totals.scheduled.toFixed(1)}h</span></div>
    <div class="sum-line"><span>過不足（当月累計）</span><span class="v">${s.totals.overtime>=0?'+':''}${s.totals.overtime.toFixed(1)}h</span></div>
    <div class="sum-line"><span>休日勤務（当月累計）</span><span class="v">${s.totals.holidayWork.toFixed(1)}h</span></div>
    <div class="sum-line"><span>早朝深夜時間帯勤務</span><span class="v">${(s.totals.night+s.totals.earlyPay).toFixed(1)}h</span></div>
  `;
  document.getElementById('sumLeave').innerHTML = `
    <div class="sum-line"><span>有休使用</span><span class="v">${s.countYukyu}日</span></div>
    <div class="sum-line"><span>代休使用</span><span class="v">${s.countDaikyu}日</span></div>
    <div class="sum-line"><span>特休使用</span><span class="v">${s.countTokkyu}日（${s.countTokkyu*8}時間）</span></div>
    <div class="sum-line"><span>欠勤</span><span class="v">${s.countKekkin}日</span></div>
  `;
  document.getElementById('summaryOverlay').classList.add('show');
}
document.getElementById('summaryBtn').addEventListener('click', openSummary);
document.getElementById('summaryCloseBtn').addEventListener('click', ()=>{
  document.getElementById('summaryOverlay').classList.remove('show');
});

(async function init(){
  setupSelectors();
  await loadMonth(true);
})();
</script>
</body>
</html>
